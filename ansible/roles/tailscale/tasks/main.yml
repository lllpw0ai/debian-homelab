- name: Add Tailscale's signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale's apt repository
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_facts['distribution_release'] }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
  register: tailscale_repo

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: "{{ tailscale_repo.changed }}"

- name: Tailscale starts on boot
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true

- name: Check whether this machine is already on the tailnet
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Join the tailnet
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ tailscale_authkey }}
    --hostname={{ inventory_hostname }}
    --accept-dns=false
  no_log: true
  when: >-
    (tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('')
    != 'Running'
