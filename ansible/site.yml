- name: Configure homelab server
  hosts: homelab
  become: true
  roles:
    - { role: base,      tags: base }
    - { role: ssh,       tags: ssh }
    - { role: tailscale, tags: tailscale }
    - { role: docker,    tags: docker }
    - { role: services,  tags: services }
    - { role: backups,   tags: backups }
