services:
  technitium:
    image: technitium/dns-server:latest
    container_name: technitium
    hostname: debian-fish
    ports:
      - "5380:5380/tcp"   # web console
      - "53:53/udp"       # DNS
      - "53:53/tcp"       # DNS
    environment:
      - DNS_SERVER_DOMAIN=debian-fish
      - TZ=America/New_York
    volumes:
      - ./config:/etc/dns
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000
